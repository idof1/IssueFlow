server:
  port: 8080

spring:
  application:
    name: issueflow
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER
    username: sa
    password: password
    driverClassName: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    properties:
      hibernate:
        globally_quoted_identifiers: false
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: issueflow-super-secret-key-for-jwt-signing-at-least-256-bits-long
  expiration-ms: 86400000

scheduling:
  escalation:
    cron: "0 0 0 29 2 ?"
